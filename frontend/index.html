<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OX - Boss Dashboard</title><style>body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 20px; margin: 0; }.card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; }table { width: 100%; border-collapse: collapse; margin-top: 15px; }th, td { border: 1px solid #334155; padding: 12px; text-align: left; }th { background: #334155; }.badge-online { background: #16a34a; color: #fff; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }</style></head><body><h1>👑 Boss Dashboard</h1><div class="card"><h2>📱 Worker Active Login Status</h2><div id="workers-list">Loading...</div></div><script>async function fetchDashboard() { try { const res = await fetch("https://ox-pzdd.onrender.com/api/boss/dashboard"); const data = await res.json(); document.getElementById("workers-list").innerHTML = data.workers.length ? data.workers.map(w => `<p style="font-size: 1.1rem;"><b>+91 ${w.phone}</b> — <span class="badge-online">${w.status || "ONLINE"}</span> <span style="color:#aaa; font-size:0.9rem;">(Last Login: ${w.last_login ? new Date(w.last_login).toLocaleString("en-IN") : "N/A"})</span></p>`).join("") : "<p>Koi worker active login nahi hai.</p>"; } catch(err) { console.error(err); } } fetchDashboard(); setInterval(fetchDashboard, 5000);</script></body></html>
