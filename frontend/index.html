<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OX - Boss Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    .card { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #334155; padding: 8px; text-align: left; }
    th { background: #334155; }
    img { max-width: 100px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>👑 Boss Dashboard</h1>
  <div class="card">
    <h2>Workers Cash Status</h2>
    <div id="workers-list">Loading...</div>
  </div>
  <div class="card">
    <h2>Expense Reports & Proofs</h2>
    <table>
      <thead>
        <tr>
          <th>Worker</th>
          <th>Amount</th>
          <th>Mode</th>
          <th>Proof</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="expenses-list"></tbody>
    </table>
  </div>
  <script>
    async function fetchDashboard() {
      try {
        const res = await fetch("https://ox-pzdd.onrender.com/api/boss/dashboard");
        const data = await res.json();
        
        document.getElementById('workers-list').innerHTML = data.workers.map(w => 
          `<p><b>${w.name}:</b> Cash-in-Hand: ₹${w.cash_in_hand.toFixed(2)}</p>`
        ).join('');

        document.getElementById('expenses-list').innerHTML = data.expenses.map(e => `
          <tr>
            <td>${e.worker_name}</td>
            <td>₹${e.amount}</td>
            <td>${e.payment_mode} (${e.proof_type})</td>
            <td><a href="${e.image_url}" target="_blank"><img src="${e.image_url}" /></a></td>
            <td>${e.timestamp}</td>
          </tr>
        `).join('');
      } catch(err) {
        console.error(err);
      }
    }
    fetchDashboard();
    setInterval(fetchDashboard, 5000);
  </script>
</body>
</html>
