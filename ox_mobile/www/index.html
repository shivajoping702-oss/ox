<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OX - Worker App</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0f1d; color: #ffffff; padding: 16px; margin: 0; }
    .card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.15); }
    h1, h2, h3 { margin-top: 0; }
    .cash-text { font-size: 2rem; font-weight: bold; color: #00e676; margin-top: 10px; }
    input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; box-sizing: border-box; font-size: 1rem; }
    button { background: #00e676; color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
    .btn-secondary { background: rgba(255,255,255,0.2); color: #fff; }
    .profile-avatar { border-radius: 50%; width: 65px; height: 65px; object-fit: cover; border: 2px solid #00e676; }
    .profile-section { display: flex; align-items: center; gap: 15px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="login-screen" class="card">
    <h2>📱 Worker Login</h2>
    <p>Apna mobile number darj karein:</p>
    <div id="step-phone">
      <input type="tel" id="txt-phone" placeholder="Mobile Number (e.g. 9876543210)" maxlength="10">
      <button type="button" onclick="sendOTP()">Send OTP / ओ.टी.पी भेजें</button>
    </div>
    <div id="step-otp" class="hidden">
      <p style="color:#00e676;">✔ OTP sent to mobile number!</p>
      <input type="number" id="txt-otp" placeholder="Enter 4-Digit OTP" maxlength="4">
      <button type="button" onclick="verifyOTP()">Verify OTP & Login</button>
    </div>
  </div>

  <div id="app-screen" class="hidden">
    <div class="card profile-section">
      <img id="worker-avatar" class="profile-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Worker">
      <div>
        <h2 id="lbl-worker-name" style="margin: 0;">Ramesh Kumar</h2>
        <p style="margin: 3px 0 0 0; color: #aaa; font-size: 0.9rem;" id="lbl-worker-phone">+91 9876543210</p>
      </div>
    </div>
    <div class="card">
      <p style="margin: 0;">Current Cash-in-Hand / कुल नकद:</p>
      <div class="cash-text" id="lbl-cash">₹ 200.00</div>
    </div>
    <div class="card">
      <h3>+ Add Expense Proof / खर्चा जोड़ें</h3>
      <label>Amount Spent (खर्चा राशि ₹):</label>
      <input type="number" id="txt-amount" placeholder="e.g. 250">
      <label style="display:block; margin-top:15px;">Payment Mode (भुगतान का प्रकार):</label>
      <select id="ddl-mode">
        <option value="CASH">Cash (नकद)</option>
        <option value="UPI">Online / UPI</option>
      </select>
      <label style="display:block; margin-top:15px;">Proof Upload (प्रमाण फोटो):</label>
      <input type="file" id="file-camera" accept="image/*" capture="environment" style="display:none" onchange="previewImage(this, 'LIVE_CAMERA')">
      <input type="file" id="file-screenshot" accept="image/*" style="display:none" onchange="previewImage(this, 'UPI_SCREENSHOT')">
      <button type="button" class="btn-secondary" onclick="document.getElementById('file-camera').click()">📷 Live Camera (कैमरा)</button>
      <button type="button" class="btn-secondary" onclick="document.getElementById('file-screenshot').click()">🖼️ Upload Screenshot</button>
      <img id="preview-img" style="border-radius:10px; width:100%; height:auto; display:none; margin-top:10px;" alt="Proof">
      <div id="file-info" style="margin-top: 8px; font-size: 0.9rem; color: #00E676;"></div>
      <button type="button" style="background: #00E676;" onclick="submitExpense()">✅ Submit Expense / खर्चा जमा करें</button>
    </div>
  </div>

  <script>
    let currentWorker = null;
    let selectedProofType = "";
    let base64Image = "";

    function sendOTP() {
      const phone = document.getElementById('txt-phone').value;
      if (!phone || phone.length < 10) return alert("Sahi 10-digit mobile number daalein!");
      document.getElementById('step-phone').classList.add('hidden');
      document.getElementById('step-otp').classList.remove('hidden');
    }

    async function verifyOTP() {
      const phone = document.getElementById('txt-phone').value;
      const otp = document.getElementById('txt-otp').value;
      if (!otp) return alert("Kripya OTP daalein!");

      currentWorker = {
        id: 1,
        name: "Ramesh Kumar",
        phone: "+91 " + phone,
        avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80",
        cash_in_hand: 200.00
      };

      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('lbl-worker-name').innerText = currentWorker.name;
      document.getElementById('lbl-worker-phone').innerText = currentWorker.phone;
      document.getElementById('worker-avatar').src = currentWorker.avatar;
      document.getElementById('lbl-cash').innerText = `₹ ${currentWorker.cash_in_hand.toFixed(2)}`;
    }

    function previewImage(input, proofType) {
      if (input.files && input.files[0]) {
        selectedProofType = proofType;
        const reader = new FileReader();
        reader.onload = function(e) {
          base64Image = e.target.result;
          const img = document.getElementById('preview-img');
          img.src = base64Image;
          img.style.display = 'block';
          document.getElementById('file-info').innerText = `✔ Proof Selected (${proofType})`;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function submitExpense() {
      const amount = document.getElementById('txt-amount').value;
      const payment_mode = document.getElementById('ddl-mode').value;

      if (!amount) return alert("Please enter amount!");
      if (!base64Image) return alert("Please attach photo proof!");

      try {
        const res = await fetch("https://ox-pzdd.onrender.com/api/worker/add-expense", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            worker_id: currentWorker.id,
            amount,
            payment_mode,
            proof_type: selectedProofType,
            image_url: base64Image
          })
        });

        const data = await res.json();
        alert("Expense Saved Permanently in Supabase!");
        currentWorker.cash_in_hand = data.remaining_cash;
        document.getElementById('lbl-cash').innerText = `₹ ${data.remaining_cash.toFixed(2)}`;
        document.getElementById('txt-amount').value = "";
        document.getElementById('preview-img').style.display = 'none';
        document.getElementById('file-info').innerText = "";
        base64Image = "";
      } catch(err) {
        alert("Error connecting to server!");
      }
    }
  </script>
</body>
</html>
