<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OX - Worker App</title><style>body { font-family: system-ui, sans-serif; background: #0a0f1d; color: #fff; padding: 16px; margin: 0; }.card { background: rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.15); }input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; box-sizing: border-box; font-size: 1rem; }button { background: #00e676; color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }.hidden { display: none !important; }</style></head><body><div id="login-screen" class="card"><h2>📱 Worker Login</h2><p>Apna registered mobile number daalein:</p><div id="step-phone"><input type="tel" id="txt-phone" placeholder="Mobile Number (e.g. 9876543210)" maxlength="10"><button type="button" onclick="sendOTP()">Send OTP</button></div><div id="step-otp" class="hidden"><p style="color:#00e676;">✔ OTP Bheja Gaya! (Test OTP: 1234)</p><input type="number" id="txt-otp" placeholder="4-Digit OTP Daalein" maxlength="4"><button type="button" onclick="verifyOTP()">Verify OTP & Login</button></div></div><div id="app-screen" class="hidden"><div class="card"><h2>Welcome Worker</h2><p id="lbl-phone" style="color:#00e676;"></p><button type="button" style="background:#ff5252; color:#fff;" onclick="logout()">Logout</button></div></div><script>let currentPhone = ""; async function sendOTP() { const phone = document.getElementById("txt-phone").value; if (!phone || phone.length < 10) return alert("Sahi 10-digit mobile number daalein!"); currentPhone = phone; try { const res = await fetch("https://ox-pzdd.onrender.com/api/worker/send-otp", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ phone }) }); const data = await res.json(); if (res.ok) { document.getElementById("step-phone").classList.add("hidden"); document.getElementById("step-otp").classList.remove("hidden"); } else { alert(data.error || "OTP भेजने में त्रुटि!"); } } catch(err) { alert("Server Error!"); } } async function verifyOTP() { const otp = document.getElementById("txt-otp").value; if (!otp) return alert("OTP daalein!"); try { const res = await fetch("https://ox-pzdd.onrender.com/api/worker/verify-otp", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ phone: currentPhone, otp }) }); const data = await res.json(); if (res.ok) { localStorage.setItem("ox_user_phone", currentPhone); showAppScreen(currentPhone); } else { alert(data.error || "Galat OTP!"); } } catch(err) { alert("Server Error!"); } } function showAppScreen(phone) { document.getElementById("login-screen").classList.add("hidden"); document.getElementById("app-screen").classList.remove("hidden"); document.getElementById("lbl-phone").innerText = "Logged in as: +91 " + phone; } function logout() { localStorage.removeItem("ox_user_phone"); location.reload(); } window.onload = function() { const savedPhone = localStorage.getItem("ox_user_phone"); if (savedPhone) showAppScreen(savedPhone); };</script></body></html>
